<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-label="Zukuenft:in — Integral / Transdisziplinär (Aurea). Stilisiertes Portraet-Platzhalter (Prototyp).">
  <defs>
