      <path d="M 174.0 238.8 C 171.0 151.0, 309.0 151.0, 306.0 238.8 L 308.0 359.0 L 295.0 361.0 C 297.0 236.0, 268.5 179.0, 240.0 177.0 C 211.5 179.0, 183.0 236.0, 185.0 361.0 L 172.0 359.0 Z" fill="#61617b" stroke="#d0ccf3" stroke-opacity="0.5" stroke-width="1.5"/>
      
      <!-- rim light on the lit edge of the head -->
      <path d="M 183.0 221.8 C 183.0 165.0, 208.7 159.0, 240.0 159.0 C 271.4 159.0, 297.0 165.0, 297.0 221.8 C 297.0 261.6, 287.9 292.8, 240.0 307.0 C 192.1 292.8, 183.0 261.6, 183.0 221.8 Z" fill="none" stroke="#CBC6F2" stroke-opacity="0.85" stroke-width="2"/>
    </g>

    <rect x="0" y="0" width="480" height="600" filter="url(#grain10)" opacity="0.5"/>
    <rect x="0.75" y="0.75" width="478.5" height="598.5" rx="17" fill="none" stroke="#2C3658" stroke-width="1.5"/>

    <g font-family="'IBM Plex Mono','SFMono-Regular',monospace">
