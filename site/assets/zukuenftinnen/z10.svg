      <stop offset="0" stop-color="#CBC6F2" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#CBC6F2" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#141A2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141A2E"/><stop offset="1" stop-color="#0B0E1A"/>
    </linearGradient>
    <filter id="grain10" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="2" seed="73" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
    <clipPath id="card9"><rect x="0" y="0" width="480" height="600" rx="18"/></clipPath>
    <clipPath id="head9"><path d="M 183.0 221.8 C 183.0 165.0, 208.7 159.0, 240.0 159.0 C 271.4 159.0, 297.0 165.0, 297.0 221.8 C 297.0 261.6, 287.9 292.8, 240.0 307.0 C 192.1 292.8, 183.0 261.6, 183.0 221.8 Z"/></clipPath>
    
  </defs>

  <g clip-path="url(#card9)">
