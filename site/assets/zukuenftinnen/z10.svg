      <path d="M 216.1 301.0 L 214.1 327.0 C 68.0 371.0, 68.0 399.0, 68.0 600.0 L 412.0 600.0 C 412.0 399.0, 412.0 371.0, 265.9 327.0 L 263.9 301.0 Z" fill="#3d3e52"/>
