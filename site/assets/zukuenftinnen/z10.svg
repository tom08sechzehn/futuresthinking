      <text x="22" y="29" font-size="11" letter-spacing="1.2" fill="#7A82A6">PROTOTYP · PLATZHALTER</text>
      <text x="20" y="554" font-size="11" letter-spacing="1.4" fill="#CBC6F2" opacity="0.92">Z10 · AUREA</text>
      <text x="20" y="574" font-size="13" fill="#F2F0FF" font-weight="500">Integral / Transdisziplinär</text>
