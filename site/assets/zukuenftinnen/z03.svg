<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-label="Zukuenft:in — Systemisch (Noor). Stilisiertes Portraet-Platzhalter (Prototyp).">
  <defs>
    <radialGradient id="halo2" cx="0.3" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#4ADE80" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#141A2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141A2E"/><stop offset="1" stop-color="#0B0E1A"/>
    </linearGradient>
    <filter id="grain3" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.74" numOctaves="2" seed="24" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
    <clipPath id="card2"><rect x="0" y="0" width="480" height="600" rx="18"/></clipPath>
    <clipPath id="head2"><path d="M 189.0 213.0 C 189.0 153.0, 211.9 147.0, 240.0 147.0 C 268.1 147.0, 291.0 153.0, 291.0 213.0 C 291.0 255.0, 286.9 288.0, 240.0 303.0 C 193.1 288.0, 189.0 255.0, 189.0 213.0 Z"/></clipPath>
    
  </defs>

  <g clip-path="url(#card2)">
    <rect x="0" y="0" width="480" height="600" fill="url(#floor2)"/>
    <rect x="0" y="0" width="480" height="600" fill="url(#halo2)"/>

    <g transform="rotate(-2 240.0 228)">
      <!-- shoulders / clothing -->
      <path d="M 218.6 297.0 L 216.9 323.0 C 90.0 367.0, 90.0 395.0, 90.0 600.0 L 390.0 600.0 C 390.0 395.0, 390.0 367.0, 263.1 323.0 L 261.4 297.0 Z" fill="#1b4435"/>
      <!-- hair behind head (locs, afro mass, bun) -->
      
      <!-- HEAD: lit base, then shadow half clipped to head = duotone terminator -->
      <g clip-path="url(#head2)">
        <rect x="0" y="0" width="480" height="600" fill="#51df85"/>
        <rect x="236.0" y="0" width="480" height="600" fill="#1f513b"/>
      </g>
      <!-- headwear / hair on top -->
      
      
      <path d="M 177.0 216.0 C 173.0 139.0, 307.0 139.0, 303.0 216.0 L 309.0 389.0 L 289.0 391.0 C 293.0 232.0, 279.8 171.0, 240.0 169.0 C 200.2 171.0, 187.0 232.0, 191.0 391.0 L 171.0 389.0 Z" fill="#276c48" stroke="#5ce18d" stroke-opacity="0.5" stroke-width="1.5"/>
      
      <!-- rim light on the lit edge of the head -->
      <path d="M 189.0 213.0 C 189.0 153.0, 211.9 147.0, 240.0 147.0 C 268.1 147.0, 291.0 153.0, 291.0 213.0 C 291.0 255.0, 286.9 288.0, 240.0 303.0 C 193.1 288.0, 189.0 255.0, 189.0 213.0 Z" fill="none" stroke="#4ADE80" stroke-opacity="0.85" stroke-width="2"/>
    </g>

    <rect x="0" y="0" width="480" height="600" filter="url(#grain3)" opacity="0.5"/>
    <rect x="0.75" y="0.75" width="478.5" height="598.5" rx="17" fill="none" stroke="#2C3658" stroke-width="1.5"/>

    <g font-family="'IBM Plex Mono','SFMono-Regular',monospace">
      <rect x="14" y="14" width="160" height="22" rx="4" fill="#1E2742" stroke="#2C3658" stroke-width="1"/>
      <text x="22" y="29" font-size="11" letter-spacing="1.2" fill="#7A82A6">PROTOTYP · PLATZHALTER</text>
      <text x="20" y="554" font-size="11" letter-spacing="1.4" fill="#4ADE80" opacity="0.92">Z03 · NOOR</text>
      <text x="20" y="574" font-size="13" fill="#F2F0FF" font-weight="500">Systemisch</text>
    </g>
  </g>
</svg>