<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-label="Zukuenft:in — Kritisch-Normativ (Amani). Stilisiertes Portraet-Platzhalter (Prototyp).">
  <defs>
    <radialGradient id="halo4" cx="0.3" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#F2555A" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#F2555A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#141A2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141A2E"/><stop offset="1" stop-color="#0B0E1A"/>
    </linearGradient>
    <filter id="grain5" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="2" seed="38" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
    <clipPath id="card4"><rect x="0" y="0" width="480" height="600" rx="18"/></clipPath>
    <clipPath id="head4"><path d="M 184.0 224.4 C 184.0 170.0, 209.2 164.0, 240.0 164.0 C 270.8 164.0, 296.0 170.0, 296.0 224.4 C 296.0 262.5, 289.3 292.4, 240.0 306.0 C 190.7 292.4, 184.0 262.5, 184.0 224.4 Z"/></clipPath>
    
  </defs>

  <g clip-path="url(#card4)">
    <rect x="0" y="0" width="480" height="600" fill="url(#floor4)"/>
    <rect x="0" y="0" width="480" height="600" fill="url(#halo4)"/>

    <g transform="rotate(0 240.0 238)">
      <!-- shoulders / clothing -->
      <path d="M 216.5 300.0 L 214.6 326.0 C 70.0 370.0, 70.0 398.0, 70.0 600.0 L 410.0 600.0 C 410.0 398.0, 410.0 370.0, 265.4 326.0 L 263.5 300.0 Z" fill="#47202b"/>
      <!-- hair behind head (locs, afro mass, bun) -->
      <circle cx="240.0" cy="194.5" r="68.3" fill="#732e37" stroke="#f3666a" stroke-opacity="0.45" stroke-width="2"/>
      <!-- HEAD: lit base, then shadow half clipped to head = duotone terminator -->
      <g clip-path="url(#head4)">
        <rect x="0" y="0" width="480" height="600" fill="#f35c61"/>
        <rect x="236.0" y="0" width="480" height="600" fill="#55252e"/>
      </g>
      <!-- headwear / hair on top -->
      
      
      
      <path d="M 183.0 235.3 C 183.0 174.0, 297.0 174.0, 297.0 235.3 C 262.4 186.0, 217.6 186.0, 183.0 235.3 Z" fill="#732e37"/>
      <!-- rim light on the lit edge of the head -->
      <path d="M 184.0 224.4 C 184.0 170.0, 209.2 164.0, 240.0 164.0 C 270.8 164.0, 296.0 170.0, 296.0 224.4 C 296.0 262.5, 289.3 292.4, 240.0 306.0 C 190.7 292.4, 184.0 262.5, 184.0 224.4 Z" fill="none" stroke="#F2555A" stroke-opacity="0.85" stroke-width="2"/>
    </g>

    <rect x="0" y="0" width="480" height="600" filter="url(#grain5)" opacity="0.5"/>
    <rect x="0.75" y="0.75" width="478.5" height="598.5" rx="17" fill="none" stroke="#2C3658" stroke-width="1.5"/>

    <g font-family="'IBM Plex Mono','SFMono-Regular',monospace">
      <rect x="14" y="14" width="160" height="22" rx="4" fill="#1E2742" stroke="#2C3658" stroke-width="1"/>
      <text x="22" y="29" font-size="11" letter-spacing="1.2" fill="#7A82A6">PROTOTYP · PLATZHALTER</text>
      <text x="20" y="554" font-size="11" letter-spacing="1.4" fill="#F2555A" opacity="0.92">Z05 · AMANI</text>
      <text x="20" y="574" font-size="13" fill="#F2F0FF" font-weight="500">Kritisch-Normativ</text>
    </g>
  </g>
</svg>