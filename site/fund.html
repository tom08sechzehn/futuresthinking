<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fund — futuresthinking</title>
<meta name="description" content="Ein Fund aus dem offenen Zukunftsarchiv von futuresthinking.eu — Beipackzettel, Fundort, Jahr und die Zukünftin, die ihn aufnahm.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://futuresthinking.eu/fund">
<!-- Open Graph -->
<meta property="og:type" content="article">
<meta property="og:site_name" content="futuresthinking">
<meta property="og:title" content="Fund — futuresthinking">
<meta property="og:description" content="Ein Fund aus dem offenen Zukunftsarchiv von futuresthinking.eu — Beipackzettel, Fundort, Jahr und die Zukünftin, die ihn aufnahm.">
<meta property="og:url" content="https://futuresthinking.eu/fund">
<meta property="og:image" content="https://futuresthinking.eu/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="de_DE">
<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Fund — futuresthinking">
<meta name="twitter:description" content="Ein Fund aus dem offenen Zukunftsarchiv von futuresthinking.eu.">
<meta name="twitter:image" content="https://futuresthinking.eu/assets/og-image.png">
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="alternate icon" href="favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="assets/ft-core.css">
<script src="assets/ft-data.js" defer></script>
<script src="assets/ft-shell.js" defer></script>
</head>
<body data-page="archiv">

<main id="main">
  <div class="wrap" style="padding-top:var(--ft-space-lg)">
    <a class="crumb" href="index.html#archiv"><span aria-hidden="true">←</span> zurück ins Archiv</a>
  </div>

  <article class="wrap section--tight" id="fundView" style="max-width:820px">
    <!-- per JS gefüllt -->
  </article>

  <section class="wrap section" id="relatedWrap" hidden>
    <header class="sec-head">
      <div>
        <p class="sec-head__eyebrow" id="relatedEyebrow">aus derselben schule</p>
        <h2 class="sec-head__title">Verwandte Funde</h2>
      </div>
    </header>
    <div class="fund-grid" id="relatedGrid"></div>
  </section>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
 FT.ready(function () {
  var id = FT.qs("id");
  var f = FT.fundById(id);
  var view = document.getElementById("fundView");

  if (!f) {
    view.innerHTML = '<p class="eyebrow">404</p><h1 class="hero__title" style="font-size:2rem">Diesen Fund gibt es (noch) nicht.</h1>' +
      '<p class="lead" style="margin:var(--ft-space-md) 0">Vielleicht wartet er noch darauf, eingereicht zu werden.</p>' +
      '<div style="display:flex;gap:var(--ft-space-sm);flex-wrap:wrap"><a class="btn btn--primary" href="index.html#archiv">ins Archiv</a><a class="btn btn--secondary" href="einreichen.html">＋ Fund einreichen</a></div>';
    return;
  }

  document.title = f.objektname + " (" + f.fundjahr + ") — futuresthinking";
  var accent = FT.accentFor(f.schule);
  var kur = FT.kuratorin(f.schule);
  // In-world-Aufnahmesatz: passende Stimme, deterministisch
  var stimme = FT.stimmen().filter(function (s) { return s.slug === f.schule; })[0];
  var satz = stimme ? stimme.aufnahme[(f.fundjahr) % stimme.aufnahme.length] : "";

  function row(label, value) {
    if (!value) return "";
    return '<div style="display:flex;gap:var(--ft-space-md);padding:var(--ft-space-sm) 0;border-bottom:var(--ft-border)">' +
      '<span class="mono" style="flex:none;width:130px;color:var(--ft-muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em">' + label + '</span>' +
      '<span style="color:var(--ft-ink)">' + value + '</span></div>';
  }
  var methodeHtml = f.entstehungsmethode
    ? '<a href="methoden.html?methode=' + encodeURIComponent(f.entstehungsmethode) + '">' + FT.esc(f.entstehungsmethode) + ' ↗</a>'
    : '<span style="color:var(--ft-muted)">nicht dokumentiert</span>';

  view.innerHTML =
    '<div style="display:flex;align-items:baseline;gap:var(--ft-space-md);flex-wrap:wrap;margin-bottom:var(--ft-space-xs)">' +
      '<span class="mono" style="font-size:2.5rem;font-weight:700;color:' + accent + ';font-family:var(--ft-font-display)">' + f.fundjahr + '</span>' +
      '<span class="fund__schule" style="color:' + accent + '">✶ ' + FT.esc(FT.schuleLabel(f.schule)) + '</span>' +
    '</div>' +
    '<h1 class="hero__title" style="font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:var(--ft-space-md)">' + FT.esc(f.objektname) + '</h1>' +
    '<div class="fund__foot" style="margin-bottom:var(--ft-space-lg)">' +
      '<span class="chip chip--' + FT.esc(f.wuenschbarkeit) + '">' + FT.esc(f.wuenschbarkeit) + '</span>' +
      '<span class="chip chip--' + FT.esc(f.wahrscheinlichkeit) + '">' + FT.esc(f.wahrscheinlichkeit) + '</span>' +
      (f.tonalitaet ? '<span class="chip chip--ghost">' + FT.esc(f.tonalitaet) + '</span>' : '') +
    '</div>' +
    // Beipackzettel
    '<div class="panel" style="border-left:3px solid ' + accent + '">' +
      '<p class="eyebrow" style="margin-bottom:var(--ft-space-sm)">⊟ beipackzettel</p>' +
      '<p style="font-family:var(--ft-font-mono);font-size:.95rem;line-height:1.7;color:var(--ft-body)">' + FT.esc(f.beipackzettel) + '</p>' +
    '</div>' +
    // Metadaten
    '<div style="margin-top:var(--ft-space-lg)">' +
      row("Fundort", FT.esc(f.fundort)) +
      row("Material", FT.esc(f.material)) +
      row("Urheber", FT.esc(f.urheber)) +
      row("Entstehungsmethode", methodeHtml) +
      row("Lizenz", FT.esc(f.lizenz)) +
    '</div>' +
    // In-world-Aufnahme durch die Zukünftin
    (satz ? '<div style="margin-top:var(--ft-space-lg);display:flex;gap:var(--ft-space-md);align-items:flex-start;padding:var(--ft-space-md);border:1px solid ' + accent + ';border-radius:var(--ft-radius-card);background:var(--ft-surface)">' +
      '<img src="assets/zukuenftinnen/' + stimme.portrait + '" alt="" width="48" height="48" style="border-radius:50%;border:1px solid ' + accent + ';flex:none">' +
      '<div><p class="mono" style="font-size:.72rem;color:var(--ft-muted);text-transform:uppercase;letter-spacing:.05em">' + FT.esc(kur) + ' nahm diesen Fund auf</p>' +
      '<p style="font-family:var(--ft-font-display);font-style:italic;color:var(--ft-ink);margin-top:4px">„' + FT.esc(satz) + '"</p></div>' +
    '</div>' : '') +
    // CTA
    '<div style="margin-top:var(--ft-space-xl);display:flex;gap:var(--ft-space-sm);flex-wrap:wrap;align-items:center">' +
      '<a class="btn btn--primary" href="einreichen.html">＋ einen eigenen Fund einreichen</a>' +
      '<a class="btn btn--ghost" href="index.html#archiv">← weiter stöbern</a>' +
    '</div>';

  // Verwandte Funde (gleiche Schule)
  var related = FT.funde().filter(function (x) { return x.schule === f.schule && x.objekt_id !== f.objekt_id; }).slice(0, 3);
  if (related.length) {
    document.getElementById("relatedEyebrow").textContent = "aus dem sternbild " + FT.schuleLabel(f.schule).toLowerCase() + " · kuratiert von " + kur;
    FT.renderFunds(document.getElementById("relatedGrid"), related);
    document.getElementById("relatedWrap").hidden = false;
  }
 });
});
</script>

</body>
</html>
