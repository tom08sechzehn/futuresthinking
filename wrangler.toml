# wrangler.toml — Cloudflare Worker + Static Assets Konfiguration.
#
# Modell: Workers-Static-Assets (NICHT klassisches Pages).
#   - /api/submit            -> Worker (worker.js -> functions/api/submit.js)
#   - alles andere           -> statische Assets aus public-build/ (ASSETS-Binding)
#
# Deploy erfolgt via `wrangler deploy` (NICHT mehr `wrangler pages deploy`).
# Build erzeugt vorher public-build/ (tools/build.mjs, npm run build).
#
# NICHT-geheime Runtime-Config steht unten in [vars] (versioniert, ueberlebt jeden Deploy).
# Nur die ECHTEN Secrets gehoeren ins Dashboard (Workers & Pages > Settings >
# Variables and Secrets) als Typ "Secret":
#   TURNSTILE_SECRET, GITHUB_TOKEN            (Worker-Runtime, geheim)
# CI-Deploy-Secrets (nur falls deploy.yml genutzt wird) als GitHub-Actions-Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name = "futuresthinking"
compatibility_date = "2025-01-01"

# ESM Worker-Entry: routet /api/submit, faellt sonst auf ASSETS zurueck.
main = "worker.js"

# Statische Assets (fertiger Build aus tools/build.mjs).
# Default-Verhalten: vorhandene Assets werden ZUERST serviert; der Worker laeuft
# nur fuer Nicht-Asset-Pfade wie /api/submit. Genau das wollen wir.
[assets]
directory = "./public-build"
binding = "ASSETS"

# Nicht-geheime Runtime-Config (das Repo ist public -> kein Geheimnis).
# WICHTIG: Plaintext-Variablen im Dashboard werden bei jedem `wrangler deploy` entfernt;
# deshalb gehoeren GITHUB_OWNER/REPO/BASE_BRANCH HIER hin, damit sie jeden Deploy ueberleben.
# (Die echten Secrets TURNSTILE_SECRET + GITHUB_TOKEN bleiben im Dashboard.)
[vars]
GITHUB_OWNER = "tom08sechzehn"
GITHUB_REPO = "futuresthinking"
GITHUB_BASE_BRANCH = "main"

# KV-Namespace fuer die Orakel-Soft-Limits (Per-IP-Rate-Limit + globaler Tages-Notaus).
# OPTIONAL, aber empfohlen: Einmalig anlegen (GUI: Workers & Pages > KV > Create namespace
# "ORACLE_LIMITS"), die erzeugte id unten eintragen und die drei Zeilen ent-kommentieren.
# OHNE dieses Binding laeuft das Orakel weiter — dann schuetzt NUR Turnstile (kein Tages-Notaus).
# Siehe oracle-backend/INTEGRATION.md, Schritt 2b.
[[kv_namespaces]]
binding = "ORACLE_LIMITS"
id = "fff4a403476e42718ddc502fdcdc6b4d"

# KV-Namespace fuer den Orakel-Eingang (Fragen + Antworten, 30 Tage TTL).
# SETUP (einmalig, 3 Schritte):
#   1. Cloudflare Dashboard > Workers & Pages > KV > Create namespace → Name: "ORACLE_LOG"
#   2. Die erzeugte ID unten bei `id =` eintragen, dann diese 3 Zeilen ent-kommentieren.
#   3. Als Cloudflare Secret (Workers > Settings > Variables/Secrets) eintragen:
#      Name: ORACLE_LOG_SECRET   Wert: ein langes, selbst gewähltes Passwort
#      → Tom öffnet dann https://futuresthinking.eu/api/oracle-log?token=DEIN_PASSWORT
# [[kv_namespaces]]
# binding = "ORACLE_LOG"
# id = "ERSETZEN_MIT_ECHTER_KV_ID"

# KV-Namespace fuer veröffentlichte Blog-Posts (/api/blog + site/blog.html).
# SETUP (einmalig, 2 Schritte):
#   1. Cloudflare Dashboard > Workers & Pages > KV > Create namespace → Name: "ORACLE_BLOG"
#   2. Die erzeugte ID unten eintragen, dann diese 3 Zeilen ent-kommentieren.
# [[kv_namespaces]]
# binding = "ORACLE_BLOG"
# id = "ERSETZEN_MIT_ECHTER_KV_ID"

# send_email-Binding fuer die Kachel „Methode vorschlagen" (/api/vorschlag).
# GRATIS-Weg ueber Cloudflare EMAIL ROUTING (NICHT das kostenpflichtige „Email Sending"):
# Ein Worker darf kostenlos an eine VERIFIZIERTE Routing-Zieladresse senden.
# `destination_address` beschraenkt das Binding HART auf genau diese Adresse
# (tom.thi.2022@gmail.com) — der Worker kann an niemanden sonst senden.
# Voraussetzung: Email Routing auf futuresthinking.eu aktiv + die Adresse verifiziert.
# (Ohne aktives Routing greift der freundliche 503-Fallback in vorschlag.js.)
[[send_email]]
name = "EMAIL"
destination_address = "tom.thi.2022@gmail.com"
